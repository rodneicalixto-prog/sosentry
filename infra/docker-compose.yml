version: '3.9'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sosentry-backend
    restart: unless-stopped
    env_file: ../backend/.env
    expose:
      - "3001"
    volumes:
      - nf_uploads:/app/uploads/nf
    networks:
      - sosentry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sosentry-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    networks:
      - sosentry
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nf_uploads:

networks:
  sosentry:
    driver: bridge
