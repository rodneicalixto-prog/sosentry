version: '3.9'
services:
  backend:
    build: ../backend
    container_name: sosentry-backend
    restart: unless-stopped
    env_file: ../backend/.env
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
