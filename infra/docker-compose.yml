version: '3.9'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sosentry-backend
    restart: unless-stopped
    env_file: ../backend/.env
    expose:
      - "3001"
    networks:
      - sosentry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sosentry-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    networks:
      - sosentry
    depends_on:
      backend:
        condition: service_healthy

networks:
  sosentry:
    driver: bridge
