<!DOCTYPE html>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')

            .catch((e) => console.warn('[SW] erro:', e))
        })
      }
